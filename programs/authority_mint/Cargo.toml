[package]
name = "authority_mint"
version = "0.1.0"
edition = "2021"
description = "Simple NFT faucet for testing - allows anyone to mint from collection"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "authority_mint"
test = false

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.0", features = ["metadata"] }
mpl-token-metadata = "5.0.0-beta.0"
# Remove bubblegum dependencies to avoid conflicts
# mpl-bubblegum = "2.1.1"
# spl-account-compression = "0.4.0"
# spl-noop = "0.2.0"
