[package]
name = "multi_raffle_light"
version = "0.1.0"
edition = "2021"
description = "Multi-raffle with Light Protocol ZK compression"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "multi_raffle_light"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

# Light Protocol ZK Compression
light-sdk = { version = "0.18.0", features = ["anchor", "anchor-discriminator", "cpi-context"] }
light-hasher = "5.0.0"

# Pin blake3 to avoid edition2024 issue  
blake3 = "=1.8.2"

# TODO: Add back for NFT prize support
# anchor-spl = { version = "0.31.1", features = ["metadata"] }
# mpl-token-metadata = "4.1.2"
